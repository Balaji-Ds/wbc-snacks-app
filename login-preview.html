<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sleek Login - Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="SleekLogin/wwwroot/lib/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, 'Helvetica Neue', Arial, 'Noto Sans', 'Liberation Sans', sans-serif; }
  </style>
  <link href="SleekLogin/wwwroot/css/site.css" rel="stylesheet">
</head>
<body>
  <div class="login-wrapper">
    <div class="glass-panel login-card">
      <div class="brand">
        <div class="brand-logo"></div>
        <div class="brand-title">SleekLogin</div>
      </div>
      <p class="muted">Sign in to continue</p>

      <form onsubmit="event.preventDefault(); alert('Preview only');">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input class="form-control" placeholder="you@example.com" type="email" />
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input class="form-control" placeholder="••••••••" type="password" />
        </div>
        <div class="mb-3 form-check">
          <input class="form-check-input" type="checkbox" id="rememberPreview" />
          <label class="form-check-label" for="rememberPreview">Remember me</label>
        </div>
        <button type="submit" class="btn btn-primary w-100 mb-2">Sign in</button>
        <div class="text-center link-muted">
          <small>Forgot your password?</small>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
